<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden;background:#0A0A0B;color:#FAFAFA;font-family:Geist,sans-serif;font-variant-numeric:tabular-nums}
.status{height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:14px}
.bar{display:flex;justify-content:space-between;align-items:center;padding:6px 16px 16px 20px}
.bar h1{font-size:26px;font-weight:600;letter-spacing:-.02em}
.icon{width:44px;height:44px;border-radius:10px;border:1px solid #27272A;display:grid;place-items:center;font-size:20px}
.card{margin:0 16px;border:1px solid #27272A;background:#18181B;border-radius:16px;padding:16px;display:flex;gap:14px}
.cv{width:76px;height:112px;border-radius:6px;background:linear-gradient(160deg,#3F3F46,#27272A);flex:none}
.k{font-size:12px;color:#A1A1AA;font-weight:500}
.card h2{font-size:20px;font-weight:600;margin-top:4px}
.a{font-size:14px;color:#A1A1AA;margin-top:2px}
.pb{height:4px;border-radius:2px;background:#27272A;margin-top:16px}
.pb i{display:block;height:100%;width:42%;background:#7C9CFF;border-radius:2px}
.pm{display:flex;justify-content:space-between;font-size:12px;color:#A1A1AA;margin-top:6px}
.btn{margin-top:12px;display:inline-block;background:#FAFAFA;color:#0A0A0B;font-weight:600;font-size:14px;padding:9px 16px;border-radius:10px}
.sec{display:flex;justify-content:space-between;padding:24px 20px 12px;font-size:15px;font-weight:600}
.sec span{color:#A1A1AA;font-weight:500;font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.it{border:1px solid #27272A;border-radius:12px;padding:10px;display:flex;gap:10px;align-items:center}
.it .s{width:36px;height:52px;border-radius:4px;background:#27272A;flex:none}
.it b{font-size:14px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it small{font-size:12px;color:#A1A1AA}
.nav{position:absolute;left:0;right:0;bottom:0;height:80px;border-top:1px solid #27272A;background:#0A0A0B;display:flex;justify-content:space-around;padding-top:12px;font-size:12px;color:#A1A1AA}
.nav div{text-align:center}.nav em{display:block;font-style:normal;font-size:20px}
.nav .on{color:#FAFAFA}
</style></head><body>
<div class="status"><span>21:48</span><span>▴ ▮</span></div>
<div class="bar"><h1>Library</h1><div class="icon">+</div></div>
<div class="card"><div class="cv"></div><div style="flex:1;min-width:0">
  <div class="k">Continue reading</div><h2>Middlemarch</h2><div class="a">George Eliot · Chapter 38</div>
  <div class="pb"><i></i></div><div class="pm"><span>42%</span><span>EPUB</span></div><div class="btn">Resume</div></div></div>
<div class="sec">All books <span>24</span></div>
<div class="grid">
  <div class="it"><div class="s"></div><div style="min-width:0"><b>Origin of Species</b><small>PDF · p. 112</small></div></div>
  <div class="it"><div class="s"></div><div style="min-width:0"><b>Meditations</b><small>EPUB · Finished</small></div></div>
  <div class="it"><div class="s"></div><div style="min-width:0"><b>Field notes</b><small>TXT · New</small></div></div>
  <div class="it"><div class="s"></div><div style="min-width:0"><b>Distributed Systems</b><small>MD · 68%</small></div></div>
  <div class="it"><div class="s"></div><div style="min-width:0"><b>Moby-Dick</b><small>FB2 · Missing</small></div></div>
  <div class="it"><div class="s"></div><div style="min-width:0"><b>Attention Is All…</b><small>PDF · p. 4</small></div></div>
</div>
<div class="nav"><div class="on"><em>▤</em>Library</div><div><em>⚙</em>Settings</div></div>
</body></html>

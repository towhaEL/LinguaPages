<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden;background:#141218;color:#E6E0E9;font-family:Roboto,sans-serif}
.status{height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:14px}
.bar{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 16px}
.bar h1{font-size:22px;font-weight:400}
.ib{width:48px;height:48px;display:grid;place-items:center;font-size:22px}
.card{margin:8px 16px;background:#211F26;border-radius:12px;padding:16px;display:flex;gap:16px}
.cv{width:80px;height:120px;border-radius:8px;background:#4A4458;flex:none}
.card h2{font-size:18px;font-weight:500}
.s{font-size:14px;color:#CAC4D0;margin-top:2px}
.pb{height:4px;border-radius:2px;background:#49454F;margin-top:16px}.pb i{display:block;width:42%;height:100%;background:#D0BCFF;border-radius:2px}
.btn{margin-top:14px;display:inline-block;background:#D0BCFF;color:#381E72;font-weight:500;font-size:14px;padding:10px 24px;border-radius:20px}
.sec{padding:20px 16px 8px;font-size:14px;font-weight:500;color:#CAC4D0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 12px;padding:0 16px}
.g .c{aspect-ratio:2/3;border-radius:8px;background:#36343B}
.g b{display:block;font-size:13px;font-weight:500;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g small{font-size:12px;color:#CAC4D0}
.fab{position:absolute;right:16px;bottom:100px;width:56px;height:56px;border-radius:16px;background:#4F378B;color:#EADDFF;display:grid;place-items:center;font-size:26px}
.nav{position:absolute;left:0;right:0;bottom:0;height:80px;background:#211F26;display:flex;justify-content:space-around;padding-top:12px;font-size:12px;font-weight:500}
.nav em{display:grid;place-items:center;font-style:normal;width:64px;height:32px;border-radius:16px;margin:0 auto 4px}
.nav .on em{background:#4A4458}
</style></head><body>
<div class="status"><span>21:48</span><span>▴ ▮</span></div>
<div class="bar"><h1>Library</h1><div style="display:flex"><div class="ib">⌕</div><div class="ib">⋮</div></div></div>
<div class="card"><div class="cv"></div><div style="flex:1"><h2>Middlemarch</h2><div class="s">George Eliot</div><div class="s">Chapter 38 · 42%</div><div class="pb"><i></i></div><div class="btn">Continue</div></div></div>
<div class="sec">All books</div>
<div class="grid">
  <div class="g"><div class="c"></div><b>Origin of Species</b><small>PDF</small></div>
  <div class="g"><div class="c"></div><b>Meditations</b><small>EPUB</small></div>
  <div class="g"><div class="c"></div><b>Field notes</b><small>TXT</small></div>
</div>
<div class="fab">+</div>
<div class="nav"><div class="on" style="text-align:center"><em>▤</em>Library</div><div style="text-align:center"><em>⚙</em>Settings</div></div>
</body></html>

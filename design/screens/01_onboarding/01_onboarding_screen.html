<body class="bg-surface text-on-surface antialiased select-none flex justify-center items-center min-h-screen p-0 m-0">

<main class="w-full max-w-[412px] h-[915px] max-h-[915px] bg-surface relative flex flex-col justify-between overflow-hidden shadow-2xl">
<!-- Android Native System Status Bar Emulation -->
<header class="w-full pt-3 px-6 flex justify-between items-center text-secondary select-none z-20">
<span class="font-label-md text-label-md font-semibold tracking-tight text-on-surface">9:41</span>
<div class="flex items-center space-x-2">
<span class="material-symbols-outlined text-[16px] leading-none text-secondary">wifi</span>
<span class="material-symbols-outlined text-[16px] leading-none text-secondary">signal_cellular_alt</span>
<span class="material-symbols-outlined text-[18px] leading-none text-secondary">battery_full</span>
</div>
</header>
<!-- TopAppBar Component (Rendered strictly according to Shared Components JSON specs & rules) -->
<div class="w-full z-20">
<div class="flex justify-between items-center w-full px-5 py-3.5 max-w-2xl mx-auto">
<!-- Leading brand cluster -->
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-[22px]" data-icon="local_library">local_library</span>
<span class="font-headline-md text-headline-md font-medium text-on-surface tracking-tight">OpenPages</span>
</div>
<!-- Trailing action button -->
<button class="text-on-surface-variant font-label-md text-label-md hover:text-primary transition-colors duration-150 active:opacity-80 py-1.5 px-3 rounded-full hover:bg-surface-container/60 transition-all" type="button">
          Skip
        </button>
</div>
</div>
<!-- Upper Hero Visual (Approx 52% Height) -->
<section class="relative flex-1 w-full flex flex-col items-center justify-center px-6 overflow-hidden">
<!-- Soft ambient circular paper glow backdrop -->
<div class="absolute w-72 h-72 rounded-full bg-surface-container-low blur-2xl opacity-60 pointer-events-none"></div>
<!-- Book Illustration -->
<div class="relative w-full max-w-[320px] aspect-square flex items-center justify-center z-10 transition-transform duration-700 ease-out hover:scale-[1.02]">

</div>
</section>

<section class="w-full px-6 flex flex-col items-center text-center z-10">
<!-- Editorial Headline -->
<h1 class="font-display-lg-mobile text-display-lg-mobile text-on-surface font-headline-md tracking-tight leading-snug max-w-[340px]">
        Your books, all in one place
      </h1>
<!-- Subtitle description -->
<p class="font-body-md text-body-md text-secondary mt-3.5 max-w-[320px] leading-relaxed">
        EPUB, PDF, TXT, Markdown, HTML and FB2. DRM-free and stored only on your phone.
      </p>
<!-- Supported Formats Badges -->
<div class="flex flex-wrap items-center justify-center gap-1.5 mt-5">
<span class="inline-flex items-center px-2.5 py-1 rounded-full bg-surface-container-lowest border border-outline-variant/40 text-secondary font-label-sm text-label-sm shadow-[0_1px_2px_rgba(0,0,0,0.02)]">
          EPUB
        </span>
<span class="inline-flex items-center px-2.5 py-1 rounded-full bg-surface-container-lowest border border-outline-variant/40 text-secondary font-label-sm text-label-sm shadow-[0_1px_2px_rgba(0,0,0,0.02)]">
          PDF
        </span>
<span class="inline-flex items-center px-2.5 py-1 rounded-full bg-surface-container-lowest border border-outline-variant/40 text-secondary font-label-sm text-label-sm shadow-[0_1px_2px_rgba(0,0,0,0.02)]">
          TXT

<span class="inline-flex items-center px-2.5 py-1 rounded-full bg-surface-container-lowest border border-outline-variant/40 text-secondary font-label-sm text-label-sm shadow-[0_1px_2px_rgba(0,0,0,0.02)]">

<span aria-current="step" aria-label="Page 1 of 3" class="w-6 h-2 rounded-full bg-primary-container transition-all duration-300"></span>
<!-- Dot 2: Inactive -->
<span aria-label="Page 2 of 3" class="w-2 h-2 rounded-full bg-secondary-fixed-dim/70 transition-all duration-300"></span>
<!-- Dot 3: Inactive -->
<span aria-label="Page 3 of 3" class="w-2 h-2 rounded-full bg-secondary-fixed-dim/70 transition-all duration-300"></span>
</div>

<span class="material-symbols-outlined text-[18px] ml-1.5">arrow_forward</span>

</div>

<div class="w-32 h-1 bg-outline/20 rounded-full mt-5"></div>

<body class="bg-surface text-on-surface antialiased selection:bg-secondary-fixed min-h-screen flex items-center justify-center p-0 sm:p-4">
<!-- Mobile Viewport Frame (412px x 915px ratio) -->
<div class="relative w-full max-w-[412px] h-[915px] max-h-screen bg-surface flex flex-col justify-between overflow-hidden shadow-2xl sm:rounded-[36px] sm:border sm:border-outline-variant/30">
<!-- Top Utility Bar (Shared Component: TopAppBar with suppress borders) -->
<header class="w-full z-10 pt-3">
<div class="flex justify-between items-center w-full px-5 py-3.5 max-w-2xl mx-auto">
<!-- Brand Leading Identity -->
<div class="flex items-center space-x-2.5">
<div class="w-8 h-8 rounded-full bg-secondary-fixed flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[19px]">local_library</span>
</div>
<span class="font-headline-md text-headline-md font-medium text-on-surface tracking-tight">OpenPages</span>
</div>
<!-- Trailing Action Button -->
<button class="text-on-surface-variant font-label-md text-label-md hover:text-primary transition-colors duration-150 active:opacity-80 px-2 py-1" type="button">
          Skip
        </button>
</div>
</header>
<!-- Main Content Canvas (Scrollable or flex fitted) -->
<main class="flex-1 flex flex-col justify-between px-5 pt-1 pb-4 overflow-y-auto">
<!-- Upper Section: Editorial Illustration Showcase -->
<div class="w-full flex flex-col items-center">
<div class="w-full max-w-[340px] aspect-[4/3.8] rounded-2xl overflow-hidden relative flex items-center justify-center bg-surface-container-low border border-outline-variant/30 p-2">

</div>
<!-- Interactive Customization Feature Tag Pills -->
<div class="flex flex-wrap items-center justify-center gap-2 mt-4 px-1">
<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container-lowest border border-outline-variant/40 text-secondary font-label-sm text-label-sm">
<span class="material-symbols-outlined text-[14px] text-primary">format_size</span>

          </span>
<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container-lowest border border-outline-variant/40 text-secondary font-label-sm text-label-sm">
<span class="material-symbols-outlined text-[14px] text-primary">format_align_justify</span>
            Margins &amp; Spacing
          </span>
<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container-lowest border border-outline-variant/40 text-secondary font-label-sm text-label-sm">
<span class="material-symbols-outlined text-[14px] text-primary">stylus_note</span>
            Highlights &amp; Notes
          </span>
</div>
</div>
<!-- Copy Area -->
<div class="flex flex-col items-center text-center my-auto py-2">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface tracking-tight mb-2.5 max-w-xs">
          Read the way you like
        </h1>
<p class="font-body-md text-body-md text-secondary leading-relaxed max-w-[310px] mx-auto">
          Themes, fonts, line spacing and margins. Highlights, notes and bookmarks that stay with the page.
        </p>
</div>
<!-- Bottom Interactive Cluster (Dots + Actions + Privacy Tag) -->
<div class="w-full flex flex-col items-center space-y-4 pt-1 pb-2">
<!-- Carousel Page Indicators (4 dots) -->
<div aria-label="Onboarding carousel progression" class="flex items-center justify-center space-x-2 py-1" role="tablist">
<!-- Dot 1: Inactive -->
<span aria-label="Page 1" class="w-2 h-2 rounded-full bg-outline-variant/50 transition-all duration-300"></span>
<!-- Dot 2: ACTIVE (Elongated ink blue pill) -->
<span aria-current="step" aria-label="Page 2 of 4 (Current)" class="w-6 h-2 rounded-full bg-primary-container transition-all duration-300"></span>
<!-- Dot 3: Inactive -->
<span aria-label="Page 3" class="w-2 h-2 rounded-full bg-outline-variant/50 transition-all duration-300"></span>
<!-- Dot 4: Inactive -->
<span aria-label="Page 4" class="w-2 h-2 rounded-full bg-outline-variant/50 transition-all duration-300"></span>
</div>

<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>

<span class="material-symbols-outlined text-[14px]">lock</span>
<span class="font-label-sm text-label-sm">100% Offline • Zero telemetry &amp; personal storage</span>
</div>

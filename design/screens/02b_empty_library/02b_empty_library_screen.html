<!-- Interactive Ripple Simulation for Mobile Fidelity -->
<script>
    document.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', (e) => {
        // Lightweight visual feedback trigger
        btn.classList.add('opacity-90');
        setTimeout(() => btn.classList.remove('opacity-90'), 120);
      });
    });
